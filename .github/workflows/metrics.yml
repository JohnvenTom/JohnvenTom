name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  core:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics-core.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.METRICS_TOKEN }}
          committer_message: "chore: update metrics-core [skip ci]"
          user: JohnvenTom
          template: classic
          base: header, activity, community, repositories, metadata
          config_animations: yes
          config_timezone: Asia/Shanghai
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_lines: yes
          plugin_habits: yes
          plugin_habits_from: 500
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: starred
          plugin_introduction: yes
          plugin_introduction_title: yes
          plugin_licenses: yes
          plugin_licenses_setup: yes
          plugin_licenses_legal: yes
          plugin_projects: yes
          plugin_projects_limit: 4
          plugin_projects_descriptions: yes

  achievements:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics-achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.METRICS_TOKEN }}
          committer_message: "chore: update metrics-achievements [skip ci]"
          user: JohnvenTom
          template: classic
          base: ""
          config_animations: yes
          config_timezone: Asia/Shanghai
          plugin_achievements: yes
          plugin_achievements_limit: 12
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          plugin_people: yes
          plugin_people_types: followers, following
          plugin_people_limit: 24
          plugin_people_size: 28
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit, pull_request, issue
          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_days: 0
          plugin_reactions_details: count, percentage
          plugin_discussions: yes
          plugin_discussions_categories: yes

  activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics-activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.METRICS_TOKEN }}
          committer_message: "chore: update metrics-activity [skip ci]"
          user: JohnvenTom
          template: classic
          base: ""
          config_animations: yes
          config_timezone: Asia/Shanghai
          plugin_activity: yes
          plugin_activity_days: 0
          plugin_activity_limit: 8
          plugin_activity_filter: all
          plugin_activity_visibility: all
          plugin_activity_timestamps: yes
          plugin_stars: yes
          plugin_stars_limit: 10
          plugin_stargazers: yes
          plugin_stargazers_type: graph
          plugin_traffic: yes
          plugin_contributors: yes
          plugin_contributors_contributions: yes
          plugin_contributors_sections: contributors
